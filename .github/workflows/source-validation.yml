name: Source validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public tree excludes signing material
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          paths = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden = re.compile(r'(^|/)(\.env($|\.)|secrets?|credentials?)(/|$)|\.(p12|mobileprovision|pem|key)$', re.I)
          private_config = re.compile(r'(^|/)(appstore-configuration\.json|verify\.sh)$', re.I)
          bad = [p for p in paths if forbidden.search(p) or private_config.search(p)]
          if bad:
              raise SystemExit("Unexpected private/signing files tracked:\n" + "\n".join(bad))
          PY

      - name: Verify legacy glass is forced in source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          glass = Path("submodules/TelegramUI/Components/GlassBackgroundComponent/Sources/GlassBackgroundComponent.swift").read_text()
          lens = Path("submodules/TelegramUI/Components/LiquidLens/Sources/LiquidLensView.swift").read_text()
          context = Path("submodules/TelegramUI/Sources/SharedAccountContext.swift").read_text()
          assert "useCustomGlassImpl: Bool = true" in glass
          assert "private static let useSystemLiquidLens = false" in lens
          assert context.count("GlassBackgroundView.useCustomGlassImpl = true") == 2
          assert not re.search(r"GlassBackgroundView\.useCustomGlassImpl = (?:settings\.fakeGlass|immediateExperimentalUISettingsValue)", context)
          PY

      - name: Verify build target and Make.py syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          assert 'name = "Swiftgram"' in Path("Telegram/BUILD").read_text()
          PY
          python3 -m py_compile build-system/Make/Make.py build-system/Make/BuildConfiguration.py
